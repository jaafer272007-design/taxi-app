name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: services/api (build, migrate, test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api

    # Required to boot the app / run migrations. WhatsApp & FCM vars are left
    # absent ON PURPOSE so the DEV-fallback paths (OTP-to-console, push-to-log)
    # are exercised — that is expected in CI.
    env:
      DATABASE_URL: postgresql://taxi:taxi@localhost:5432/taxi_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production-0123456789
      TZ: Asia/Baghdad
      NODE_ENV: test

    services:
      # Match local dev (services/api/docker-compose.yml): PostGIS + Redis.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: taxi
          POSTGRES_DB: taxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxi -d taxi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No engines/.nvmrc in the repo → Node 20 LTS.
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Lint (if a lint script exists)
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Test (unit — Prisma mocked)
        run: npm test

      # Runs against the live Postgres above. Kept as its own command so the
      # unit suite stays hermetic, but NOT optional: a mocked `findMany` never
      # applies a `where` clause, so only these tests can catch a bug that lives
      # in the seam between two layers — like departNow trips being posted
      # correctly, queried correctly, and still invisible to every rider.
      - name: Test (integration — real database)
        run: npm run test:int

  admin:
    name: apps/admin (lint, build, e2e)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/admin

    # Lint and build need no live backend — the panel talks to the API only at
    # RUNTIME (server-side fetch) — but the Playwright suite does, so this job
    # stands up the same Postgres + Redis the API job uses. Its own database, so
    # the destructive E2E seed can never reach the API job's.
    env:
      API_BASE_URL: http://127.0.0.1:3000
      DATABASE_URL: postgresql://taxi:taxi@localhost:5432/taxi_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production-0123456789
      TZ: Asia/Baghdad
      # Test-only credentials for a throwaway database that exists for the
      # length of one CI job. The E2E suite reads the same values.
      SUPER_ADMIN_USERNAME: e2e-superadmin
      SUPER_ADMIN_PASSWORD: e2e-password-1234
      ADMIN_PHONE: "+9647700000000"

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: taxi
          POSTGRES_DB: taxi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxi -d taxi_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            services/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # ── E2E: the panel is driven against a real API, not a mock ───────────
      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Build the API
        working-directory: services/api
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run build

      - name: Seed deterministic E2E state
        working-directory: services/api
        run: npx ts-node prisma/seed-e2e.ts

      # Only Chromium: this suite tests application behaviour, not cross-browser
      # rendering, and three engines would triple the job for no extra signal.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright starts both servers itself (see playwright.config.ts), so
      # this runs the same way locally and here.
      - name: Run Playwright E2E suite
        run: npm run e2e

      # Uploaded only on failure, and only because a failure is what needs
      # diagnosing: the trace replays the run step by step, so a red CI run can
      # be understood without reproducing it locally.
      - name: Upload Playwright traces + screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-failures
          path: |
            apps/admin/playwright-report/**
            apps/admin/test-results/**
          if-no-files-found: warn
          retention-days: 7

  # One Flutter job: analyze the rider app, run all Flutter tests, and
  # generate/compare the UI golden screenshots for BOTH packages/shared and
  # apps/rider. Committing goldens from a single job avoids two jobs racing to
  # push the branch. Independent of the services/api job above.
  ui-goldens:
    name: flutter (analyze, tests, UI goldens)
    runs-on: ubuntu-latest

    # Needed to commit the generated screenshots back to the PR branch.
    permissions:
      contents: write

    steps:
      - name: Checkout (PR branch head, so screenshots can be pushed back)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Pin the Flutter stable version — goldens are renderer/font sensitive, so
      # the version that GENERATES baselines must match the one that COMPARES.
      - name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies (shared)
        working-directory: packages/shared
        run: flutter pub get

      - name: Install dependencies (rider)
        working-directory: apps/rider
        run: flutter pub get

      - name: Install dependencies (driver)
        working-directory: apps/driver
        run: flutter pub get

      - name: Analyze rider
        working-directory: apps/rider
        run: flutter analyze

      - name: Analyze driver
        working-directory: apps/driver
        run: flutter analyze

      - name: Decide golden mode
        id: mode
        run: |
          # Compare (regression guard) when ALL baselines already exist;
          # otherwise generate them. A commit message containing [update-goldens]
          # forces regeneration (use it to bless an intended UI change).
          if ls packages/shared/test/goldens/*.png >/dev/null 2>&1 \
             && ls apps/rider/test/goldens/*.png >/dev/null 2>&1 \
             && ls apps/driver/test/goldens/*.png >/dev/null 2>&1 \
             && ! git log -1 --pretty=%B | grep -qF '[update-goldens]'; then
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "All baselines present -> comparison (visual regression guard)."
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
            echo "Missing baselines or [update-goldens] -> generating."
          fi

      - name: Test — shared (compare goldens)
        if: steps.mode.outputs.update == 'false'
        working-directory: packages/shared
        run: flutter test

      - name: Test — shared (generate goldens)
        if: steps.mode.outputs.update == 'true'
        working-directory: packages/shared
        run: flutter test --update-goldens

      - name: Test — rider (compare goldens)
        if: steps.mode.outputs.update == 'false'
        working-directory: apps/rider
        run: flutter test

      - name: Test — rider (generate goldens)
        if: steps.mode.outputs.update == 'true'
        working-directory: apps/rider
        run: flutter test --update-goldens

      - name: Test — driver (compare goldens)
        if: steps.mode.outputs.update == 'false'
        working-directory: apps/driver
        run: flutter test

      - name: Test — driver (generate goldens)
        if: steps.mode.outputs.update == 'true'
        working-directory: apps/driver
        run: flutter test --update-goldens

      - name: Mirror screenshots into docs/ui-screenshots (for inline PR viewing)
        if: steps.mode.outputs.update == 'true'
        run: |
          mkdir -p docs/ui-screenshots
          cp packages/shared/test/goldens/*.png docs/ui-screenshots/
          cp apps/rider/test/goldens/*.png docs/ui-screenshots/
          cp apps/driver/test/goldens/*.png docs/ui-screenshots/

      - name: Commit screenshots back to the PR branch
        if: steps.mode.outputs.update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/shared/test/goldens apps/rider/test/goldens apps/driver/test/goldens docs/ui-screenshots
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
          else
            git commit -m "chore(ci): generate UI golden screenshots [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      # Always publish the screenshots + any failure/diff images, even on
      # success, so they can be downloaded from the run.
      - name: Upload UI screenshots + diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: |
            packages/shared/test/goldens/**
            packages/shared/test/failures/**
            apps/rider/test/goldens/**
            apps/rider/test/failures/**
            apps/driver/test/goldens/**
            apps/driver/test/failures/**
          if-no-files-found: warn

  # ── The polling lifecycle gate, measured in a real browser ────────────────
  # Unit and widget tests cannot DISCOVER this class of bug: a widget test
  # decides for itself what AppLifecycleState.inactive means. Only a real
  # engine knows that a browser window losing focus IS `inactive`. This job
  # boots the actual web build against the actual API and asserts that polls
  # keep flowing across a window blur — the exact thing that happens when the
  # driver app is brought to the front.
  rider-polling:
    name: apps/rider (polling lifecycle, real browser)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://taxi:taxi@localhost:5432/taxi_poll?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-dummy-jwt-secret-not-for-production-0123456789
      TZ: Asia/Baghdad
      ADMIN_PHONE: "+9647700000000"
      SUPER_ADMIN_USERNAME: e2e-superadmin
      SUPER_ADMIN_PASSWORD: e2e-password-1234
      API_URL: http://127.0.0.1:3000
      WEB_URL: http://127.0.0.1:8088

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: taxi
          POSTGRES_DB: taxi_poll
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taxi -d taxi_poll"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Same pinned stable as the goldens job.
      - name: Set up Flutter (pinned stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.0
          cache: true

      - name: Build and start the API
        working-directory: services/api
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx ts-node prisma/seed.ts
          npm run build
          # WhatsApp is deliberately unconfigured, so the OTP lands in this log
          # and the browser test reads it from there.
          node dist/main.js > "$GITHUB_WORKSPACE/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/health && break || sleep 2
          done

      - name: Build the rider web app
        working-directory: apps/rider
        run: |
          flutter pub get
          # --no-web-resources-cdn keeps CanvasKit local (no gstatic fetch);
          # --pwa-strategy=none keeps a stale service worker from serving an
          # older bundle to the test.
          flutter build web --release --pwa-strategy=none --no-web-resources-cdn \
            --dart-define=API_BASE_URL=http://127.0.0.1:3000

      - name: Serve the web build
        working-directory: apps/rider/build/web
        run: |
          python3 -m http.server 8088 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8088/ >/dev/null && break || sleep 1
          done

      - name: Run the polling lifecycle test
        working-directory: apps/rider/e2e
        env:
          API_LOG: ${{ github.workspace }}/api.log
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium
          node polling_lifecycle.mjs

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rider-polling-failure
          path: |
            apps/rider/e2e/*.png
            api.log
          if-no-files-found: warn
